[project]
name = "monitoring"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexander Sergeev",email = "aleksanteri.sergeev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
    "textual (>=8.2.7,<9.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
packages = [{include = "main.py"}, {include = "scripts"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
monitoring = "main:run"
lint = 'scripts.lint:run'

[dependency-groups]
dev = [
    "ruff (>=0.15.15,<0.16.0)"
]
